<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 游戏模拟器</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #1a1a2e;
            --light: #f7f7f7;
            --glow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px var(--primary)); }
            to { filter: drop-shadow(0 0 20px var(--secondary)); }
        }
        
        .selector-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        select:hover, select:focus {
            border-color: var(--secondary);
            box-shadow: var(--glow);
            outline: none;
        }
        
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .load-btn-container {
            text-align: center;
            margin-top: 25px;
        }
        
        .load-btn-container button {
            padding: 12px 40px;
            font-size: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .load-btn-container button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }
        
        .load-btn-container button:active {
            transform: translateY(0);
        }
        
        .game-container {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .status-message {
            text-align: center;
            color: var(--secondary);
            font-size: 1.2rem;
        }
        
        #emulator {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: var(--secondary);
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏模拟器</h1>
        
        <div class="selector-group">
            <label>🎯 选择模拟器:</label>
            <select id="core-select">
                <option value="" selected disabled>请选择模拟器</option>
                <option value="fceumm">FC/NES</option>
                <option value="snes9x">SFC/SNES</option>
                <option value="mgba">GBA</option>
                <option value="gambatte">GB/GBC</option>
                <option value="genesis_plus_gx">Sega Genesis</option>
                <option value="pcsx_rearmed">PS1</option>
                <option value="ppsspp">PSP</option>
                <option value="fbneo">街机</option>
            </select>
        </div>
        
        <div class="selector-group">
            <label>🎮 ROM 选择:</label>
            <select id="rom-select" disabled>
                <option value="" selected disabled>请先选择模拟器</option>
            </select>
        </div>
        
        <div class="load-btn-container">
            <button id="load-btn" style="margin-right: 10px;">▶️ 开始游戏</button>
            <button id="switch-game-btn">🔄 切换游戏</button>
        </div>
        
        <div id="mobile-warning" style="display: none; color: #ffcc00; font-size: 0.85rem; margin-top: 8px; text-align: center;">
            📱 移动端建议横屏
        </div>
        
        <div class="game-container">
            <div id="emulator">
                <div class="status-message">选择模拟器和 ROM 后点击开始游戏</div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Made with ❤️ by 飞飞</p>
    </footer>

    <script>
        // ROM 目录映射
        const coreToRomDir = {
            "fceumm": "http://cyberfei.com:8082/emulatorjs/roms/fceumm/",
            "snes9x": "http://cyberfei.com:8082/emulatorjs/roms/snes9x/",
            "mgba": "http://cyberfei.com:8082/emulatorjs/roms/mgba/",
            "gambatte": "http://cyberfei.com:8082/emulatorjs/roms/gambatte/",
            "genesis_plus_gx": "http://cyberfei.com:8082/emulatorjs/roms/genesis_plus_gx/",
            "pcsx_rearmed": "http://cyberfei.com:8082/emulatorjs/roms/pcsx_rearmed/",
            "ppsspp": "http://cyberfei.com:8082/emulatorjs/roms/ppsspp/",
            "fbneo": "http://cyberfei.com:8082/emulatorjs/roms/fbneo/"
        };
        
        // ROM 文件后缀映射
        const romExtensions = {
            "fceumm": [".nes"],
            "snes9x": [".sfc", ".smc", ".fig"],
            "mgba": [".gba"],
            "gambatte": [".gb", ".gbc"],
            "genesis_plus_gx": [".gen", ".md", ".smd"],
            "pcsx_rearmed": [".iso", ".bin", ".cue", ".pbp"],
            "ppsspp": [".iso", ".pbp"],
            "fbneo": [".zip", ".7z"]
        };
        
        // 获取元素
        const coreSelect = document.getElementById('core-select');
        const romSelect = document.getElementById('rom-select');
        const loadBtn = document.getElementById('load-btn');
        const switchGameBtn = document.getElementById('switch-game-btn');
        const mobileWarning = document.getElementById('mobile-warning');
        const emulatorDiv = document.getElementById('emulator');
        
        // 加载 ROM 列表
        async function loadRomList(core) {
            const romDir = coreToRomDir[core];
            
            if (!romDir) {
                romSelect.innerHTML = '<option value="" selected disabled>不支持的核心</option>';
                romSelect.disabled = true;
                return;
            }
            
            const validExts = romExtensions[core] || [];
            
            try {
                romSelect.innerHTML = '<option value="" selected disabled>正在加载 ROM 列表...</option>';
                romSelect.disabled = true;
                
                const response = await fetch(romDir + '?t=' + Date.now());
                const text = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = doc.querySelectorAll('a');
                
                romSelect.innerHTML = '<option value="" selected disabled>请选择 ROM</option>';
                
                let hasRom = false;
                links.forEach(link => {
                    const filename = link.textContent.trim();
                    
                    if (filename && 
                        !filename.startsWith('.') && 
                        !filename.endsWith('/') &&
                        validExts.some(ext => filename.toLowerCase().endsWith(ext))) {
                        
                        const option = document.createElement('option');
                        option.value = romDir + filename;
                        option.textContent = filename;
                        romSelect.appendChild(option);
                        hasRom = true;
                    }
                });
                
                if (!hasRom) {
                    romSelect.innerHTML = '<option value="" selected disabled>暂无 ROM 文件</option>';
                    romSelect.disabled = true;
                } else {
                    romSelect.disabled = false;
                }
                
            } catch (error) {
                console.error('加载 ROM 列表失败:', error);
                romSelect.innerHTML = '<option value="" selected disabled>加载失败，请重试</option>';
                romSelect.disabled = true;
            }
        }
        
        // 模拟器选择变化时
        coreSelect.addEventListener('change', function() {
            const core = this.value;
            if (core) {
                romSelect.disabled = false;
                loadRomList(core);
            } else {
                romSelect.innerHTML = '<option value="" selected disabled>请先选择模拟器</option>';
                romSelect.disabled = true;
            }
        });
        
        // 加载游戏函数
        function loadGame() {
            const core = coreSelect.value;
            const rom = romSelect.value;
            
            if (!core) {
                alert('请先选择模拟器 🎮');
                return;
            }
            if (!rom) {
                alert('请先选择 ROM 🎮');
                return;
            }
            
            // 如果已有游戏在运行，先停止
            if (document.getElementById('ejs-loader') || emulatorDiv.querySelector('iframe')) {
                console.log('检测到游戏正在运行，先停止...');
                stopGame();
            }
            
            window.EJS_core = core;
            window.EJS_gameUrl = rom;
            window.EJS_player = "#emulator";
            window.EJS_pathtodata = "http://cyberfei.com:8082/emulatorjs/data/";
            window.EJS_startOnLoaded = true;
            window.EJS_fullscreen = false;
            
            emulatorDiv.innerHTML = '<div class="status-message">⏳ 正在启动模拟器...</div>';
            
            const script = document.createElement('script');
            script.id = 'ejs-loader';
            script.src = 'http://cyberfei.com:8082/emulatorjs/data/loader.js';
            script.onload = function() {
                console.log('EmulatorJS loaded successfully, game will auto-start');
            };
            script.onerror = function() {
                console.error('Failed to load EmulatorJS');
                emulatorDiv.innerHTML = '<div class="status-message">❌ 加载失败，请刷新页面重试</div>';
                const failedScript = document.getElementById('ejs-loader');
                if (failedScript) failedScript.remove();
            };
            document.head.appendChild(script);
        }
        
        // 停止游戏函数
        function stopGame() {
            console.log('停止当前游戏...');
            
            const loaderScript = document.getElementById('ejs-loader');
            if (loaderScript) {
                loaderScript.remove();
            }
            
            emulatorDiv.innerHTML = '';
            
            delete window.EJS_core;
            delete window.EJS_gameUrl;
            delete window.EJS_player;
            delete window.EJS_pathtodata;
            delete window.EJS_startOnLoaded;
            delete window.EJS_fullscreen;
            
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => iframe.remove());
            
            console.log('游戏已停止');
        }
        
        // 绑定按钮事件
        loadBtn.addEventListener('click', loadGame);
        
        // 切换游戏按钮：刷新整个页面
        switchGameBtn.addEventListener('click', function() {
            if (confirm('确定要刷新页面切换游戏吗？')) {
                window.location.reload();
            }
        });
        
        // 移动端检测
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        }
        
        if (isMobile()) {
            mobileWarning.style.display = 'block';
        }
        
        window.addEventListener('resize', () => {
            if (isMobile()) {
                mobileWarning.style.display = 'block';
            } else {
                mobileWarning.style.display = 'none';
            }
        });
    </script>
</body>
</html>
