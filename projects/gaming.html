<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming - 复古游戏机 | Liufei's Cyber World</title>
  <meta name="description" content="复古游戏机 - 支持 FC/SNES/GBA/PS1 等模拟器，在线畅玩经典游戏。">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/svg+xml" href="avatar.svg">
  <link rel="stylesheet" href="css/common.css">

  <style>
    /* ---------- Gaming 页专属样式 ---------- */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(45deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .game-container {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      box-shadow: var(--glow);
    }

    /* 移动端横屏提示 */
    .landscape-warning {
      display: none;
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      background: linear-gradient(45deg, #ef4444, #f59e0b);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1rem;
      z-index: 10000;
      animation: pulse-warning 1.5s ease-in-out infinite;
    }

    @keyframes pulse-warning {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @media (max-width: 768px) and (orientation: portrait) {
      .landscape-warning { display: block; }
    }

    .selector-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .selector-group label {
      color: var(--accent);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .selector-group select {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--cyan);
      color: var(--text);
      padding: 8px 15px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 200px;
      max-width: 300px;
      width: 100%;
    }

    .selector-group select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #666;
    }

    .selector-group select:hover:not(:disabled),
    .selector-group select:focus {
      outline: none;
      border-color: var(--magenta);
      box-shadow: var(--glow);
    }

    #emulator {
      width: 100%;
      min-height: 400px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .status-message {
      text-align: center;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .page-footer {
      margin-top: 30px;
      text-align: center;
      color: var(--accent);
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="cyber">
  <!-- 移动端横屏提示 -->
  <div class="landscape-warning" role="alert">📱 建议横屏游玩，体验更佳 🎮</div>

  <main class="container">
    <header class="header">
      <h1>🎮 Gaming</h1>
      <p style="color: var(--accent); margin-top: 10px;">复古游戏机</p>
    </header>

    <div class="game-container">
      <div id="emulator">
        <div class="status-message">选择游戏后点击"开始游戏" 🎮</div>
      </div>

      <div style="text-align: center; margin-top: 30px;">
        <div class="selector-group">
          <label for="core-select">🕹️ 模拟器:</label>
          <select id="core-select">
            <option value="" selected disabled>请选择模拟器</option>
            <option value="fceumm">FC (红白机)</option>
            <option value="snes9x">SNES (超任)</option>
            <option value="mgba">GBA</option>
            <option value="gambatte">GB</option>
            <option value="genesis_plus_gx">Sega Genesis</option>
            <option value="pcsx_rearmed">PS1</option>
            <option value="ppsspp">PSP</option>
            <option value="fbneo">街机</option>
          </select>
        </div>

        <div class="selector-group">
          <label for="rom-select">🎮 ROM 选择:</label>
          <select id="rom-select" disabled>
            <option value="" selected disabled>请先选择模拟器</option>
          </select>
        </div>
      </div>

      <div class="selector-group" style="justify-content: center; gap: 15px;">
        <button id="load-btn" class="btn">▶️ 开始游戏</button>
        <button id="switch-btn" class="btn" style="background: linear-gradient(45deg, #f59e0b, #ef4444);">🔄 切换游戏</button>
      </div>
    </div>

    <p class="page-footer">Made with ❤️ by 飞飞</p>
  </main>

  <script src="js/site-config.js"></script>
  <script src="js/nav.js"></script>

  <script>
    // ROM 目录映射
    const coreToRomDir = {
      "fceumm": "emulatorjs/roms/fceumm/",
      "snes9x": "emulatorjs/roms/snes9x/",
      "mgba": "emulatorjs/roms/mgba/",
      "gambatte": "emulatorjs/roms/gambatte/",
      "genesis_plus_gx": "emulatorjs/roms/genesis_plus_gx/",
      "pcsx_rearmed": "emulatorjs/roms/pcsx_rearmed/",
      "ppsspp": "emulatorjs/roms/ppsspp/",
      "fbneo": "emulatorjs/roms/fbneo/"
    };

    const coreSelect = document.getElementById('core-select');
    const romSelect = document.getElementById('rom-select');
    const loadBtn = document.getElementById('load-btn');
    const emulatorDiv = document.getElementById('emulator');

    // 加载 ROM 列表
    async function loadRomList(core) {
      const romDir = coreToRomDir[core];

      if (!romDir) {
        romSelect.innerHTML = '<option value="" selected disabled>不支持的核心</option>';
        romSelect.disabled = true;
        return;
      }

      try {
        romSelect.disabled = true;
        romSelect.innerHTML = '';

        const response = await fetch(romDir + '?t=' + Date.now());
        const text = await response.text();

        // 解析 HTML 目录列表
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const links = doc.querySelectorAll('a');

        romSelect.innerHTML = '<option value="" selected disabled>请选择</option>';

        let hasRom = false;
        links.forEach(link => {
          const filename = link.textContent.trim();
          // 过滤：非隐藏文件、非目录、且是有效 ROM 文件
          if (filename &&
            !filename.startsWith('.') &&
            !filename.endsWith('/') &&
            (filename.endsWith('.nes') || filename.endsWith('.sfc') || filename.endsWith('.smc') ||
             filename.endsWith('.gba') || filename.endsWith('.gb') || filename.endsWith('.gbc') ||
             filename.endsWith('.gen') || filename.endsWith('.md') || filename.endsWith('.iso') ||
             filename.endsWith('.pbp') || filename.endsWith('.zip'))) {
            const option = document.createElement('option');
            option.value = romDir + filename;
            option.textContent = filename;
            romSelect.appendChild(option);
            hasRom = true;
          }
        });

        if (!hasRom) {
          romSelect.innerHTML = '<option value="" selected disabled>暂无 ROM 文件</option>';
          romSelect.disabled = true;
        } else {
          romSelect.disabled = false;
        }
      } catch (error) {
        console.error('加载 ROM 列表失败:', error);
        romSelect.innerHTML = '<option value="" selected disabled>加载失败，请重试</option>';
        romSelect.disabled = true;
      }
    }

    coreSelect.addEventListener('change', function () {
      const core = this.value;
      if (core) {
        loadRomList(core);
      } else {
        romSelect.innerHTML = '<option value="" selected disabled>请先选择模拟器</option>';
        romSelect.disabled = true;
      }
    });

    // 加载游戏
    function loadGame() {
      // 防止重复加载
      if (document.getElementById('ejs-loader')) {
        console.log('Loader already loaded, skipping...');
        alert('游戏已加载，请勿重复点击');
        return;
      }

      const core = coreSelect.value;
      const rom = romSelect.value;

      if (!core) {
        alert('请先选择模拟器 🎮');
        return;
      }
      if (!rom) {
        alert('请先选择 ROM 🎮');
        return;
      }

      // EmulatorJS 配置（自动启动）
      window.EJS_core = core;
      window.EJS_gameUrl = rom;
      window.EJS_player = "#emulator";
      window.EJS_pathtodata = "emulatorjs/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_fullscreen = false;

      emulatorDiv.innerHTML = '<div class="status-message">⏳ 正在启动模拟器...</div>';

      const script = document.createElement('script');
      script.id = 'ejs-loader';
      script.src = 'emulatorjs/data/loader.js';
      script.onload = function () {
        console.log('EmulatorJS loaded successfully, game will auto-start');
      };
      script.onerror = function () {
        console.error('Failed to load EmulatorJS');
        emulatorDiv.innerHTML = '<div class="status-message">❌ 加载失败，请刷新页面重试</div>';
        const failedScript = document.getElementById('ejs-loader');
        if (failedScript) failedScript.remove();
      };
      document.head.appendChild(script);
    }

    loadBtn.addEventListener('click', loadGame);

    // 切换游戏：刷新页面
    document.getElementById('switch-btn').addEventListener('click', function () {
      if (confirm('确定要切换游戏？当前进度将丢失 🎮')) {
        location.reload();
      }
    });
  </script>
</body>
</html>
