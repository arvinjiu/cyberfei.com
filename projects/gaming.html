<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming - 复古游戏机</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { 
            --primary: #00d4ff; 
            --secondary: #a855f7; 
            --bg: #0a0a0f; 
            --card: rgba(20, 20, 35, 0.9); 
            --text: #e0e0e0; 
            --accent: #06b6d4;
            --glow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        html, body {
            background-color: #0a0a0f;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Courier New', 'Fira Code', monospace; 
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, #fff, transparent);
            background-size: 350px 350px;
            animation: stars 20s linear infinite;
            opacity: 0.6;
            z-index: -1;
        }
        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-350px); }
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 999;
        }
        .container {
            width: 100%;
            max-width: 100%;
            padding: 10px 5px;
        }
        .home-btn {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            width: auto;
            font-size: 0.85rem;
        }
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }
        .game-container {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: var(--glow);
            width: 100%;
            max-width: 100%;
        }
        #emulator {
            width: 100%;
            min-height: 400px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            margin-bottom: 15px;
        }
        .status-message {
            text-align: center;
            color: var(--accent);
            font-size: 1.1rem;
        }
        .selector-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .selector-group label {
            color: var(--accent);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .selector-group select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
            max-width: 300px;
        }
        .selector-group select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
        }
        .selector-group select:hover:not(:disabled) {
            border-color: var(--secondary);
            box-shadow: var(--glow);
        }
        .selector-group select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: var(--glow);
        }
        .load-btn-container {
            display: flex;
            justify-content: center;
            margin: 10px 0 15px;
        }
        .load-btn-container button {
            padding: 8px 32px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .load-btn-container button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }
        /* 调整虚拟按键位置，避免遮挡屏幕 */
        .emulatorjs-container .ejs-controls {
            top: auto !important;
            bottom: 10px !important;
        }
        .emulatorjs-container .ejs-controls button {
            width: 50px !important;
            height: 50px !important;
            opacity: 0.6 !important;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            color: var(--accent);
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .container {
                padding: 5px;
            }
            .game-container {
                padding: 12px 8px;
            }
            .home-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
                margin-bottom: 8px;
            }
            .selector-group {
                flex-direction: column;
                align-items: stretch;
            }
            .selector-group select {
                max-width: 100%;
            }
            #emulator {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="home-btn">← 返回首页</a>
        
        <div class="game-container">
            <!-- Emulator 在最上方 -->
            <div id="emulator">
                <div class="status-message">选择游戏后点击"开始游戏" 🎮</div>
            </div>
            
            <!-- 模拟器选择 -->
            <div class="selector-group">
                <label>🕹️ 模拟器:</label>
                <select id="core-select">
                    <option value="" selected disabled>请选择模拟器</option>
                    <option value="fceumm">FC (红白机)</option>
                    <option value="snes9x">SNES (超任)</option>
                    <option value="mgba">GBA</option>
                    <option value="gambatte">GB</option>
                    <option value="genesis_plus_gx">Sega Genesis</option>
                    <option value="pcsx_rearmed">PS1</option>
                    <option value="ppsspp">PSP</option>
                    <option value="fbneo">街机</option>
                </select>
            </div>
            
            <!-- ROM 选择 -->
            <div class="selector-group">
                <label>🎮 ROM 选择:</label>
                <select id="rom-select" disabled>
                    <option value="" selected disabled>请先选择模拟器</option>
                </select>
            </div>
            
            <!-- 开始游戏按钮 -->
            <div class="load-btn-container">
                <button id="load-btn" class="home-btn" style="border: none; cursor: pointer;">▶️ 开始游戏</button>
            </div>
            <!-- 移动端横屏提示 -->
            <div id="mobile-warning" style="display: none; color: #ffcc00; font-size: 0.85rem; margin-top: 8px; text-align: center;">
                📱 移动端建议横屏
            </div>
        </div>

        <footer>
            <p>Made with ❤️ by 飞飞</p>
        </footer>
    </div>

    <script>
        // ROM 目录映射
        const coreToRomDir = {
            "fceumm": "emulatorjs/roms/fceumm/",
            "snes9x": "emulatorjs/roms/snes9x/",
            "mgba": "emulatorjs/roms/mgba/",
            "gambatte": "emulatorjs/roms/gambatte/",
            "genesis_plus_gx": "emulatorjs/roms/genesis_plus_gx/",
            "pcsx_rearmed": "emulatorjs/roms/pcsx_rearmed/",
            "ppsspp": "emulatorjs/roms/ppsspp/",
            "fbneo": "emulatorjs/roms/fbneo/"
        };
        
        // 获取元素
        const coreSelect = document.getElementById('core-select');
        const romSelect = document.getElementById('rom-select');
        const loadBtn = document.getElementById('load-btn');
        const mobileWarning = document.getElementById('mobile-warning');
        const emulatorDiv = document.getElementById('emulator');

        // 加载 ROM 列表
        async function loadRomList(core) {
            const romDir = coreToRomDir[core];
            
            if (!romDir) {
                romSelect.innerHTML = '<option value="" selected disabled>不支持的核心</option>';
                romSelect.disabled = true;
                return;
            }
            
            // ROM 文件后缀映射
            const romExtensions = {
                "fceumm": [".nes"],
                "snes9x": [".sfc", ".smc", ".fig"],
                "mgba": [".gba"],
                "gambatte": [".gb", ".gbc"],
                "genesis_plus_gx": [".gen", ".md", ".smd"],
                "pcsx_rearmed": [".iso", ".bin", ".cue", ".pbp"],
                "ppsspp": [".iso", ".pbp"],
                "fbneo": [".zip", ".7z"]
            };
            
            const validExts = romExtensions[core] || [];
            
            try {
                // 显示加载中状态
                romSelect.innerHTML = '<option value="" selected disabled>正在加载 ROM 列表...</option>';
                romSelect.disabled = true; // 加载期间禁用
                
                const response = await fetch(romDir + '?t=' + Date.now());
                const text = await response.text();
                
                // 简单解析 HTML 目录列表
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = doc.querySelectorAll('a');
                
                // 清空并添加默认选项
                romSelect.innerHTML = '<option value="" selected disabled>请选择 ROM</option>';
                
                let hasRom = false;
                links.forEach(link => {
                    const filename = link.textContent.trim();
                    
                    // 过滤条件：非空、不是隐藏文件、不是目录、有有效的 ROM 后缀
                    if (filename && 
                        !filename.startsWith('.') && 
                        !filename.endsWith('/') &&
                        validExts.some(ext => filename.toLowerCase().endsWith(ext))) {
                        
                        const option = document.createElement('option');
                        option.value = romDir + filename;
                        option.textContent = filename;
                        romSelect.appendChild(option);
                        hasRom = true;
                    }
                });
                
                if (!hasRom) {
                    romSelect.innerHTML = '<option value="" selected disabled>暂无 ROM 文件</option>';
                    romSelect.disabled = true;
                } else {
                    romSelect.disabled = false; // 加载完成启用
                }
                
            } catch (error) {
                console.error('加载 ROM 列表失败:', error);
                romSelect.innerHTML = '<option value="" selected disabled>加载失败，请重试</option>';
                romSelect.disabled = true;
            }
        }
        
        // 模拟器选择变化时
        coreSelect.addEventListener('change', function() {
            const core = this.value;
            if (core) {
                // 如果游戏正在运行，先停止
                if (document.getElementById('ejs-loader') || emulatorDiv.querySelector('iframe')) {
                    console.log('核心切换，停止当前游戏...');
                    stopGame();
                }
                
                // 启用 ROM 选择（实际在 loadRomList 中会根据结果再次设置 disabled）
                romSelect.disabled = false;
                loadRomList(core);
            } else {
                // 如果选择回退到占位项（理论上不会，因为占位项不可选），但以防万一
                romSelect.innerHTML = '<option value="" selected disabled>请先选择模拟器</option>';
                romSelect.disabled = true;
            }
        });
        
        // ROM 选择变化时
        romSelect.addEventListener('change', function() {
            const rom = this.value;
            if (rom) {
                // 如果游戏正在运行，停止并加载新的
                if (document.getElementById('ejs-loader') || emulatorDiv.querySelector('iframe')) {
                    console.log('ROM 切换，停止当前游戏并加载新的...');
                    stopGame();
                    // 延迟加载，确保旧游戏完全停止
                    setTimeout(() => {
                        loadGame();
                    }, 100);
                }
            }
        });
        
        // 停止游戏函数
        function stopGame() {
            console.log('停止当前游戏...');
            
            // 1. 移除 loader 脚本
            const loaderScript = document.getElementById('ejs-loader');
            if (loaderScript) {
                loaderScript.remove();
            }
            
            // 2. 停止所有音频（包括 Web Audio API）
            const audioElements = document.querySelectorAll('audio');
            audioElements.forEach(audio => {
                audio.pause();
                audio.src = '';
                audio.remove();
            });
            
            // 3. 关闭所有 iframe 的窗口上下文
            const allIframes = document.querySelectorAll('iframe');
            allIframes.forEach(iframe => {
                try {
                    // 尝试关闭 iframe 内的所有音频
                    if (iframe.contentWindow && iframe.contentWindow.AudioContext) {
                        const ctx = iframe.contentWindow.AudioContext;
                        if (ctx && ctx.close) ctx.close();
                    }
                    iframe.contentWindow.close();
                    iframe.contentWindow.location.reload(); // 强制刷新
                } catch (e) {
                    console.log('无法关闭 iframe:', e.message);
                }
                iframe.remove();
            });
            
            // 4. 清空模拟器容器
            emulatorDiv.innerHTML = '';
            
            // 5. 清除所有 EmulatorJS 相关的全局变量
            const ejsVars = [
                'EJS_core', 'EJS_gameUrl', 'EJS_player', 'EJS_pathtodata',
                'EJS_startOnLoaded', 'EJS_fullscreen', 'EmulatorJS',
                'ejs_loader', 'EmulatorJSLoader', 'EmulatorJSInstance'
            ];
            ejsVars.forEach(varName => {
                if (window[varName]) {
                    delete window[varName];
                }
            });
            
            // 6. 暂停所有可能存在的 AudioContext
            if (window.AudioContext || window.webkitAudioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                // 注意：无法直接访问其他 iframe 的 AudioContext，只能清理当前上下文
            }
            
            console.log('游戏已停止，所有资源已清理');
        }
        
        // 加载游戏函数
        function loadGame() {
            const core = coreSelect.value;
            const rom = romSelect.value;
            
            // 验证选择
            if (!core) {
                alert('请先选择模拟器 🎮');
                return;
            }
            if (!rom) {
                alert('请先选择 ROM 🎮');
                return;
            }
            
            // 如果已有游戏在运行，先停止
            if (document.getElementById('ejs-loader') || emulatorDiv.querySelector('iframe')) {
                console.log('检测到游戏正在运行，先停止...');
                stopGame();
            }
            
            // 设置 EmulatorJS 配置变量（自动启动）
            window.EJS_core = core;
            window.EJS_gameUrl = rom;
            window.EJS_player = "#emulator";
            window.EJS_pathtodata = "http://cyberfei.com:8082/emulatorjs/data/";
            // 让模拟器加载完成后自动启动（默认就是 true）
            window.EJS_startOnLoaded = true;
            window.EJS_fullscreen = false;
            
            // 清空容器显示加载中
            emulatorDiv.innerHTML = '<div class="status-message">⏳ 正在启动模拟器...</div>';
            
            // 动态创建 loader 脚本
            const script = document.createElement('script');
            script.id = 'ejs-loader';
            script.src = 'http://cyberfei.com:8082/emulatorjs/data/loader.js';
            script.onload = function() {
                console.log('EmulatorJS loaded successfully, game will auto-start');
                // 可以在这里显示额外信息，但不需要手动调用 start
            };
            script.onerror = function() {
                console.error('Failed to load EmulatorJS');
                emulatorDiv.innerHTML = '<div class="status-message">❌ 加载失败，请刷新页面重试</div>';
                // 如果加载失败，移除脚本标签以便重试
                const failedScript = document.getElementById('ejs-loader');
                if (failedScript) failedScript.remove();
            };
            document.head.appendChild(script);
        }
        
        // 绑定按钮事件
        loadBtn.addEventListener('click', loadGame);
        
        // 移动端检测
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        }
        
        // 显示移动端提示
        if (isMobile()) {
            mobileWarning.style.display = 'block';
        }
        
        // 监听屏幕方向变化
        window.addEventListener('resize', () => {
            if (isMobile()) {
                mobileWarning.style.display = 'block';
            } else {
                mobileWarning.style.display = 'none';
            }
        });
    </script>
</body>
</html>
